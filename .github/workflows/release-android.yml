name: Release Android

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    # Los secretos se exponen como variables de entorno del job: el contexto
    # `secrets` no se puede usar en un `if` (rompe la validación del workflow).
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Build native web bundle
        run: npm run build:native
        working-directory: web

      - name: Install mobile dependencies
        run: npm ci --no-audit --no-fund
        working-directory: mobile

      - name: Typecheck and test protocol vectors
        run: |
          npm run typecheck
          npm test -- --ci
        working-directory: mobile

      - name: Expo prebuild
        run: npx expo prebuild --platform android --no-install
        working-directory: mobile

      - name: Restore keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/nexodeck-release.keystore
        working-directory: mobile

      - name: Build APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          if [ -n "$KEYSTORE_BASE64" ]; then
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file="$PWD/app/nexodeck-release.keystore" \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
            echo "APK_PATH=app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_ENV"
          else
            # Sin keystore no hay APK firmado instalable: se publica el build de depuración.
            ./gradlew assembleDebug
            echo "APK_PATH=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
          fi

      - name: Name the APK
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p artifacts
          cp "mobile/android/$APK_PATH" "artifacts/NexoDeck-Android-${VERSION}.apk"
          cp "artifacts/NexoDeck-Android-${VERSION}.apk" artifacts/NexoDeck-Android.apk
          cd artifacts && sha256sum *.apk > SHA256SUMS-android.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexodeck-android
          path: artifacts/*

      # El release de Windows lo crea ci.yml en paralelo. Esperamos su
      # SHA256SUMS.txt para publicar un único archivo con los cuatro assets.
      - name: Merge SHA-256 checksums
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release-sums
          for attempt in $(seq 1 20); do
            if gh release download "$GITHUB_REF_NAME" --pattern SHA256SUMS.txt --dir release-sums --clobber 2>/dev/null; then
              break
            fi
            sleep 15
          done

          cat artifacts/SHA256SUMS-android.txt > artifacts/SHA256SUMS.txt
          if [ -f release-sums/SHA256SUMS.txt ]; then
            cat release-sums/SHA256SUMS.txt >> artifacts/SHA256SUMS.txt
          fi
          sort -u -k2 artifacts/SHA256SUMS.txt -o artifacts/SHA256SUMS.txt
          rm artifacts/SHA256SUMS-android.txt
          cat artifacts/SHA256SUMS.txt

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/*.apk
            artifacts/SHA256SUMS.txt
