name: Release Android

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Build native web bundle
        run: npm run build:native
        working-directory: web

      - name: Install mobile dependencies
        run: npm install --no-audit --no-fund
        working-directory: mobile

      - name: Typecheck and test protocol vectors
        run: |
          npm run typecheck
          npm test -- --ci
        working-directory: mobile

      - name: Expo prebuild
        run: npx expo prebuild --platform android --no-install
        working-directory: mobile

      - name: Restore keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/nexodeck-release.keystore
        working-directory: mobile

      - name: Build release APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file="$PWD/app/nexodeck-release.keystore" \
              -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
              -Pandroid.injected.signing.key.alias="${{ secrets.ANDROID_KEY_ALIAS }}" \
              -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEY_PASSWORD }}"
          else
            ./gradlew assembleRelease
          fi

      - name: Name the APK
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p artifacts
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "artifacts/NexoDeck-Android-${VERSION}.apk"
          cp "artifacts/NexoDeck-Android-${VERSION}.apk" artifacts/NexoDeck-Android.apk
          cd artifacts && sha256sum *.apk > SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexodeck-android
          path: artifacts/*

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/*
