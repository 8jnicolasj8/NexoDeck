name: Release Android

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    # Los secretos se exponen como variables de entorno del job: el contexto
    # `secrets` no se puede usar en un `if` (rompe la validación del workflow).
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Build native web bundle
        run: npm run build:native
        working-directory: web

      - name: Install mobile dependencies
        run: npm ci --no-audit --no-fund
        working-directory: mobile

      - name: Typecheck and test protocol vectors
        run: |
          npm run typecheck
          npm test -- --ci
        working-directory: mobile

      - name: Expo prebuild
        run: npx expo prebuild --platform android --no-install
        working-directory: mobile

      - name: Restore keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/vexadeck-release.keystore
        working-directory: mobile

      - name: Build APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          if [ -n "$KEYSTORE_BASE64" ]; then
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file="$PWD/app/vexadeck-release.keystore" \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
            echo "APK_PATH=app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_ENV"
          else
            # Sin keystore propio, Expo firma el release con la clave de
            # depuración. Se usa release igual: el APK incluye el bundle JS y
            # se instala solo, mientras que un build debug necesita Metro.
            ./gradlew assembleRelease
            echo "APK_PATH=app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_ENV"
          fi

      - name: Name the APK
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p artifacts
          cp "mobile/android/$APK_PATH" "artifacts/VexaDeck-Android-${VERSION}.apk"
          cp "artifacts/VexaDeck-Android-${VERSION}.apk" artifacts/VexaDeck-Android.apk
          cd artifacts && sha256sum *.apk > SHA256SUMS-android.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vexadeck-android
          path: artifacts/*

      # El release de Windows lo crea ci.yml en paralelo. No publicamos un
      # SHA256SUMS.txt incompleto: esperamos a que exista el de Windows (hasta
      # 30 min) y recién ahí subimos el combinado con el APK.
      - name: Merge SHA-256 checksums
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release-sums
          found=0
          for attempt in $(seq 1 90); do
            if gh release download "$GITHUB_REF_NAME" --pattern SHA256SUMS.txt --dir release-sums --clobber 2>/dev/null; then
              found=1
              break
            fi
            echo "Esperando SHA256SUMS.txt del release de Windows (intento $attempt/90)..."
            sleep 20
          done
          if [ "$found" -ne 1 ]; then
            echo "::error::El workflow de Windows no publicó SHA256SUMS.txt a tiempo; no se sube un archivo incompleto."
            exit 1
          fi

          cat artifacts/SHA256SUMS-android.txt release-sums/SHA256SUMS.txt > artifacts/SHA256SUMS.txt
          sort -u -k2 artifacts/SHA256SUMS.txt -o artifacts/SHA256SUMS.txt
          rm artifacts/SHA256SUMS-android.txt
          cat artifacts/SHA256SUMS.txt

      # gh upload --clobber reemplaza el SHA256SUMS.txt de Windows por el
      # combinado y agrega los APK sin pelear con el release de ci.yml.
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" artifacts/*.apk artifacts/SHA256SUMS.txt --clobber
