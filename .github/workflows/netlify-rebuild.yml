name: Rebuild landing on release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call Netlify build hook
        env:
          HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::NETLIFY_BUILD_HOOK is not configured. Skipping the landing rebuild."
            exit 0
          fi
          curl -fsS -X POST "$HOOK" > /dev/null
          echo "Netlify rebuild triggered."
