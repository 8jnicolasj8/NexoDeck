# Netlify: la landing es HTML estático, sin paso de build.
# Conectá el repo (rama main) y Netlify levanta esta configuración sola.

[build]
  publish = "landing"
  command = ""

# Los binarios no viven en el repo: las descargas apuntan a los assets del
# último release de GitHub (66 MB y 98 MB), así Netlify no gasta ancho de banda.

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
